name: CBS extraction worker

on:
  schedule:
    # 03:00 UTC daily. CBS tables here update quarterly at most, so this
    # is just how often we check -- the incremental-load check inside the
    # script means it only actually pulls (and commits) when a table's
    # Modified timestamp has changed.
    - cron: "0 3 * * *"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Now landing the FULL CBS catalog (several thousand tables), not a
    # curated shortlist -- a first backfill run realistically won't finish
    # in one job. 360 is the hard cap GitHub allows on hosted runners; this
    # just makes that explicit instead of relying on the (same) default.
    # A run that hits this timeout is safe to just let happen: progress is
    # saved to pipeline_state.json after every table, so tomorrow's
    # scheduled run continues from wherever this one got cut off.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run extraction worker
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          # Same fix as transform.yml/load.yml -- without this, print()
          # progress lines can sit buffered for a long time on a run that's
          # checking thousands of tables, looking identical to "stuck" in
          # the Actions log even though it's working fine underneath.
          PYTHONUNBUFFERED: "1"
        run: python fetch_cbs_tables.py

      - name: Commit updated pipeline state
        run: |
          git config user.name "cbs-pipeline-bot"
          git config user.email "actions@users.noreply.github.com"
          git add pipeline_state.json
          git diff --cached --quiet && echo "Nothing new to commit." && exit 0
          git commit -m "Update pipeline state $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
