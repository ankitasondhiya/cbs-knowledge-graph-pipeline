name: CBS transform worker

# Runs automatically right after "CBS extraction worker" (fetch.yml)
# finishes successfully -- so transform only ever runs on data that's
# already been freshly landed in R2. Doesn't touch fetch.yml at all.
on:
  workflow_run:
    workflows: ["CBS extraction worker"]
    types: [completed]
  workflow_dispatch:
    inputs:
      scope:
        description: "poc = narrow the largest tables to fit Neo4j Free (see transform/scope_filters.py). Leave blank for the full, unscoped run."
        required: false
        default: ""
        type: choice
        options:
          - ""
          - poc
      force:
        description: "true = ignore the processed-files manifest and reprocess raw files even if already marked done. Needed after fixing rdf_mapper.py/shacl_shapes.ttl and re-running against a table that previously produced nothing."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  transform:
    runs-on: ubuntu-latest
    # Only proceed if this was triggered manually, or the fetch run it's
    # reacting to actually succeeded -- no point transforming after a
    # failed/partial fetch. The scheduled/automatic path (workflow_run)
    # never sets `scope`, so it always produces the full, unscoped
    # dataset -- --scope poc is only ever a deliberate manual choice.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r transform/requirements.txt

      - name: Run transform & validate
        env:
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
          AZURE_STORAGE_CONTAINER: ${{ secrets.AZURE_STORAGE_CONTAINER }}
          # Forces Python's stdout to flush every line instead of block-
          # buffering it (the default once stdout isn't a real terminal,
          # which is exactly what a CI log is). Without this, print()
          # progress lines can sit in an internal buffer for minutes on a
          # large table -- looking identical to "stuck" in the Actions log
          # even though the script is working fine underneath.
          PYTHONUNBUFFERED: "1"
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.scope }}" = "poc" ]; then
            ARGS="$ARGS --scope poc"
          fi
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          # Print the resolved command so the log itself is proof of which
          # flags actually ran -- otherwise there's no way to confirm from
          # the log alone whether --scope poc / --force were really applied
          # (this bit us in practice: a load kept re-processing stale,
          # unscoped data because a transform run's force flag wasn't
          # visibly confirmed).
          echo "Running: python transform/run_transform.py $ARGS"
          python transform/run_transform.py $ARGS
