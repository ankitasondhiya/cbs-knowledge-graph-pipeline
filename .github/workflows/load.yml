name: CBS load worker

# Runs automatically right after "CBS transform worker" (transform.yml)
# finishes successfully -- so load only ever runs on data that's already
# passed the Validation Gate. Doesn't touch fetch.yml or transform.yml.
on:
  workflow_run:
    workflows: ["CBS transform worker"]
    types: [completed]
  workflow_dispatch:
    inputs:
      scope:
        description: "poc = load only the *.poc.nt files (matches transform's --scope poc). Leave blank for the full, unscoped load."
        required: false
        default: ""
        type: choice
        options:
          - ""
          - poc
      tables:
        description: "Optional: comma-separated CBS table IDs to load (e.g. 81578NED,84765NED,82242NED). Leave blank to load every table that has new validated data. Use this to curate a subset that fits Neo4j Aura Free's 400k relationship cap."
        required: false
        default: ""
      dry_run:
        description: "true = parse + print stats only, write NOTHING to Neo4j. Use this first to see real relationship counts per table before committing to a --tables list."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    # Only proceed if this was triggered manually, or the transform run it's
    # reacting to actually succeeded -- no point loading after a
    # failed/partial transform. The automatic path (workflow_run) always
    # loads the full, unscoped dataset -- --scope poc is only ever a
    # deliberate manual choice, same as transform.yml.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r load/requirements.txt

      - name: Load validated data into Neo4j
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          NEO4J_URI: ${{ secrets.NEO4J_URI }}
          NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
          NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.scope }}" = "poc" ]; then
            ARGS="$ARGS --scope poc"
          fi
          if [ -n "${{ github.event.inputs.tables }}" ]; then
            ARGS="$ARGS --tables ${{ github.event.inputs.tables }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python load/run_load.py $ARGS
