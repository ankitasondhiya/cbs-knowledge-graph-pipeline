name: CBS companies (KVK/GLEIF/Wikidata -> ERP -> Neo4j)

# MANUAL ONLY. Builds the company layer (named companies per CBS industry with revenue and ERP
# evidence) and loads it into the same Neo4j Aura instance as the CBS data, so the dashboard's
# "KPI 10 -- Target accounts" panel has something to show. Run "CBS load worker" first: companies
# link to the CBS :Branch / :Gemeente nodes it creates.
#
# Secrets used (repo Settings -> Secrets and variables -> Actions): NEO4J_URI, NEO4J_USERNAME, NEO4J_PASSWORD.
# Free sources only (Wikidata + GLEIF): larger companies, exact revenue where Wikidata has it.
# For the paid KVK route (SBI + staff for many more 10m+ companies) see companies/README.md.
on:
  workflow_dispatch:
    inputs:
      min_revenue_m:
        description: "Drop companies whose PUBLISHED revenue is below this many EUR million (0 = keep all)."
        required: false
        default: "10"
      min_staff:
        description: "Only companies with at least this many working persons (0 = no floor)."
        required: false
        default: "100"
      detect_erp:
        description: "true = also scan company websites for ERP fingerprints (slow, best-effort; low hit rate)."
        required: false
        default: true
        type: boolean
      use_kvk_api:
        description: "true = ALSO look up the listed companies at KVK (official industry, staff, address). COSTS MONEY: about EUR 0.02 per company. Needs the KVK_API_KEY secret. Ignored when companies/kvk_selection.csv exists."
        required: false
        default: false
        type: boolean
      kvk_max_calls:
        description: "Spending cap for use_kvk_api: max KVK PAID profile calls this run (start with 20). Profiles already fetched in an earlier run are restored from the workflow cache and are NOT paid for again. Never schedule this workflow."
        required: false
        default: "20"
      dry_run:
        description: "true = build everything and show Aura usage, but write NOTHING to Neo4j."
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  companies:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USERNAME: ${{ secrets.NEO4J_USERNAME }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      MIN_REV_M: ${{ github.event.inputs.min_revenue_m }}
      MIN_STAFF: ${{ github.event.inputs.min_staff }}
      DETECT_ERP: ${{ github.event.inputs.detect_erp }}
      DRY_RUN: ${{ github.event.inputs.dry_run }}
      USE_KVK_API: ${{ github.event.inputs.use_kvk_api }}
      KVK_MAX_CALLS: ${{ github.event.inputs.kvk_max_calls }}
      KVK_API_KEY: ${{ secrets.KVK_API_KEY }}
      # optional: free key from developer.adzuna.com -> vacancy-based buying signals
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
    defaults:
      run:
        working-directory: companies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore KVK profile cache (so companies already fetched are never paid for twice)
        uses: actions/cache@v4
        with:
          path: landing_zone/companies/kvk_profiles.jsonl
          key: kvk-profiles-${{ github.run_id }}
          restore-keys: |
            kvk-profiles-
      - run: pip install -r requirements.txt

      - name: Company list - KVK selection file if you committed one, else Wikidata + GLEIF only
        run: |
          MINREV="$(python -c "print(float('${MIN_REV_M:-10}')*1e6)")"
          python fetch_wikidata.py      # exact revenue / employees for the large, well-known companies (free)
          python fetch_gleif.py         # LEI + legal data for them (free)
          SEL=""
          [ -f kvk_selection.csv ] && SEL="kvk_selection.csv"
          [ -z "$SEL" ] && [ -f kvk_selection.xlsx ] && SEL="kvk_selection.xlsx" && pip install openpyxl
          if [ -n "$SEL" ]; then
            echo "Using KVK selection file $SEL: the complete list of 100+ staff companies"
            python import_kvk_selection.py "$SEL" --min-staff "${MIN_STAFF:-100}"
            BUILD=""
          elif [ "$USE_KVK_API" = "true" ] && [ -n "$KVK_API_KEY" ]; then
            echo "Enriching the free list with KVK profiles (paid, capped at ${KVK_MAX_CALLS:-20} calls)"
            python build_companies.py --free --min-revenue "$MINREV" --min-staff 0   # companies.json = who to look up
            python fetch_kvk.py --from-companies --max-calls "${KVK_MAX_CALLS:-20}"
            BUILD=""
          else
            echo "No kvk_selection.csv/.xlsx and no KVK API -> free sources only (a SAMPLE of large, well-known companies)"
            BUILD="--free"
          fi
          python build_companies.py $BUILD --min-revenue "$MINREV" --min-staff "${MIN_STAFF:-100}"
          python fetch_gleif.py parents
          python build_companies.py $BUILD --min-revenue "$MINREV" --min-staff "${MIN_STAFF:-100}"

      - name: ERP evidence (your CSV, vendor reference pages, website scan)
        run: |
          # each optional input is used only if you committed the file into companies/
          ARGS=""
          [ -f erp_evidence.csv ] && ARGS="$ARGS --csv erp_evidence.csv"
          [ -f erp_reference_sources.csv ] && ARGS="$ARGS --references erp_reference_sources.csv"
          [ "$DETECT_ERP" = "true" ] && ARGS="$ARGS --detect"
          if [ -n "$ARGS" ]; then python erp_enrich.py $ARGS; else echo "No ERP inputs and detection off -- ERP stays 'unknown'."; fi

      - name: Buying signals from job vacancies (your export and/or Adzuna)
        run: |
          SARGS=""
          [ -f job_postings.csv ] && SARGS="$SARGS --jobs-csv job_postings.csv"
          [ -n "$ADZUNA_APP_ID" ] && [ -n "$ADZUNA_APP_KEY" ] && SARGS="$SARGS --adzuna"
          if [ -n "$SARGS" ]; then python signals_enrich.py $SARGS; else echo "No job_postings.csv and no ADZUNA_* secrets -- skipping vacancy signals."; fi

      - name: Load into Neo4j
        run: |
          if [ "$DRY_RUN" = "true" ]; then python load_companies.py --dry-run; else python load_companies.py; fi
